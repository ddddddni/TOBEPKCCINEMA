<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TO BE CINEMA - โปรแกรมฉาย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #000;
  }
  .logo {
    text-align: center;
    line-height: 1;
  }
  .logo .top {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .logo .bottom {
    display: block;
    font-size: 20px;
    font-weight: 600;
    border-top: 2px solid #fff;
    margin-top: 4px;
    padding-top: 4px;
    letter-spacing: 2px;
  }
  .title-box {
    flex: 1;
    margin: 0 14px;
    padding: 10px 0;
    text-align: center;
    font-size: 40px;
    font-weight: 700;
    border-radius: 14px;
    background: linear-gradient(90deg, #1b8c84, #2fb3c4);
    box-shadow: 0 0 12px rgba(47, 179, 196, 0.5);
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 6px;
  }
  .menu-btn span {
    display: block;
    width: 38px;
    height: 4px;
    background: #fff;
    border-radius: 2px;
  }

  /* ---------- Day tabs ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 6px 4px;
    background: #fff;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    min-width: 110px;
    padding: 12px 10px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #1b8c84, #2fb3c4);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity .2s;
    font-family: inherit;
  }
  .tab.active { opacity: 1; box-shadow: inset 0 -4px 0 #fff; }
  .tab small { display: block; font-size: 14px; font-weight: 400; }

  .date-bar {
    padding: 10px 14px;
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(#555, #222);
    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;
  }

  /* ---------- Movie list ---------- */
  .movies { padding: 16px 12px 40px; }
  .movie {
    display: flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #222;
  }
  .poster {
    flex: 0 0 140px;
    height: 200px;
    border: 3px solid;
    border-image: linear-gradient(#4aa3d6, #8ee07a) 1;
    object-fit: cover;
    background: #111;
  }
  .info { flex: 1; min-width: 0; }
  .info h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .theater {
    font-size: 13px;
    color: #ccc;
    margin-bottom: 12px;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .badge {
    padding: 5px 14px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #1b8c84;
    border-radius: 20px;
  }
  .badge.age { background: #1b8c84; }
  .showtimes { display: flex; flex-wrap: wrap; gap: 8px; }
  .time {
    padding: 8px 18px;
    font-size: 20px;
    font-weight: 700;
    color: #2a9d8f;
    background: #fff;
    border-radius: 8px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    font-size: 18px;
  }

  @media (max-width: 480px) {
    .title-box { font-size: 30px; }
    .poster { flex: 0 0 110px; height: 160px; }
    .info h2 { font-size: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="top">TO BE</span>
    <span class="bottom">CINEMA</span>
  </div>
  <div class="title-box">โปรแกรมฉาย</div>
  <button class="menu-btn" aria-label="เมนู">
    <span></span><span></span><span></span>
  </button>
</header>

<nav class="tabs" id="tabs"></nav>
<div class="date-bar" id="dateBar"></div>
<main class="movies" id="movies"></main>

<script>
  // ===== ข้อมูลหนัง =====
  // poster = ชื่อไฟล์โปสเตอร์ในโฟลเดอร์ posters/
  const schedule = [
    {
      date: "2026-10-30",
      label: "30 ต.ค.",
      dateText: "วันศุกร์ 30 ตุลาคม 2569",
      movies: [
        { title: "โปรแกรมหน้าวิญญาณอาฆาต", poster: "posters/1.jpg", minutes: 95, age: "น 16+", lang: "TH/-", quality: "HD /1080p", times: ["10:30"] },
        { title: "ห้าแพร่ง", poster: "posters/2.jpg", minutes: 125, age: "น 16+", lang: "TH/-", quality: "HD /1080p", times: ["14:30"] }
      ]
    },
    {
      date: "2026-11-02",
      label: "2 พ.ย.",
      dateText: "วันจันทร์ 2 พฤศจิกายน 2569",
      movies: [
        { title: "ข้างบ้าน", poster: "posters/3.jpg", minutes: 120, age: "น 18+", lang: "TH/-", quality: "HD /1080p", times: ["10:30"] },
        { title: "ลัดดาแลนด์", poster: "posters/4.jpg", minutes: 125, age: "น 18+", lang: "TH/-", quality: "HD /1080p", times: ["14:30"] }
      ]
    },
    {
      date: "2026-11-03",
      label: "3 พ.ย.",
      dateText: "วันอังคาร 3 พฤศจิกายน 2569",
      movies: [
        { title: "ร่างทรง", poster: "posters/5.jpg", minutes: 131, age: "น 18+", lang: "TH/-", quality: "HD /1080p", times: ["10:30"] },
        { title: "ชัตเตอร์ กดติดวิญญาณ", poster: "posters/6.jpg", minutes: 97, age: "น 13+", lang: "TH/-", quality: "HD /1080p", times: ["14:30"] }
      ]
    },
    {
      date: "2026-11-04",
      label: "4 พ.ย.",
      dateText: "วันพุธ 4 พฤศจิกายน 2569",
      movies: [
        { title: "บอดี้ศพ#19", poster: "posters/7.jpg", minutes: 125, age: "น 16+", lang: "TH/-", quality: "HD /1080p", times: ["10:30"] },
        { title: "TERRIFIER 3", poster: "posters/8.jpg", minutes: 85, age: "น 20+", lang: "TH/-", quality: "HD /1080p", times: ["14:30"] }
      ]
    }
  ];

  const tabsEl = document.getElementById("tabs");
  const dateBarEl = document.getElementById("dateBar");
  const moviesEl = document.getElementById("movies");

  function render(index) {
    const day = schedule[index];

    // แท็บวัน
    tabsEl.innerHTML = "";
    schedule.forEach((d, i) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (i === index ? " active" : "");
      btn.innerHTML = `${d.label}<small>${d.dateText.split(" ")[0]}</small>`;
      btn.onclick = () => render(i);
      tabsEl.appendChild(btn);
    });

    // แถบวันที่
    dateBarEl.textContent = day.dateText;

    // รายการหนัง
    moviesEl.innerHTML = "";
    if (!day.movies.length) {
      moviesEl.innerHTML = `<div class="empty">ยังไม่มีรอบฉายในวันนี้</div>`;
      return;
    }

    day.movies.forEach(m => {
      const el = document.createElement("div");
      el.className = "movie";
      el.innerHTML = `
        <img class="poster" src="${m.poster}" alt="${m.title}"
             onerror="this.style.opacity=0.3">
        <div class="info">
          <h2>${m.title}</h2>
          <div class="theater">ณ ห้องศูนย์เพื่อนใจ ชมรมทูบีนัมเบอร์วัน โรงเรียนประโคนชัยพิทยาคม</div>
          <div class="badges">
            <span class="badge">${m.minutes} min</span>
            <span class="badge age">${m.age}</span>
            <span class="badge">${m.lang}</span>
            <span class="badge">${m.quality}</span>
          </div>
          <div class="showtimes">
            ${m.times.map(t => `<span class="time">${t}</span>`).join("")}
          </div>
        </div>`;
      moviesEl.appendChild(el);
    });
  }

  render(0);
</script>
</body>
</html>
